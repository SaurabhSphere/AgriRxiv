<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriRxiv Scrapper Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 24px; line-height: 1.5;
        }

        .container { max-width: 1600px; margin: auto; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 24px; background: white; padding: 20px 32px;
            border-radius: 16px; border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-area h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }

        .filter-stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .mini-stat {
            background: white;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .mini-stat .label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .mini-stat .value { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
        .highlight-blue { color: var(--accent) !important; }
        .highlight-green { color: var(--success) !important; }
        .highlight-orange { color: var(--warning) !important; }

        .main-grid { display: grid; grid-template-columns: 350px 1fr; gap: 24px; }

        .sidebar-filters {
            background: white; padding: 24px; border-radius: 16px; border: 1px solid var(--border);
            height: fit-content; position: sticky; top: 24px;
        }

        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        
        .search-input, select { 
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
            font-family: inherit; font-size: 0.9rem; box-sizing: border-box;
        }

        .content-area { background: white; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 16px 20px; background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--border); text-align: left; }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; display: inline-block; }
        .bg-complete { background: #dcfce7; color: #166534; }
        .bg-incomplete { background: #fee2e2; color: #991b1b; }
        
        /* Action Buttons */
        .action-links { display: flex; gap: 8px; margin-top: 12px; }
        .btn-action {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 6px; font-size: 0.75rem;
            font-weight: 600; text-decoration: none; transition: all 0.2s;
        }
        .btn-article { background: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; }
        .btn-article:hover { background: #dbeafe; }
        .btn-pdf { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }
        .btn-pdf:hover { background: #dcfce7; }
        .btn-disabled { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; cursor: not-allowed; }

        .chart-container { height: 200px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <div style="background: var(--primary); color: white; padding: 8px; border-radius: 8px;">
                <i data-lucide="database" size="20"></i>
            </div>
            <h1>AgriRxiv Data Manager</h1>
        </div>
        <div id="last-updated" style="font-size: 0.8rem; color: var(--text-muted);"></div>
    </header>

    <div class="filter-stats-bar">
        <div class="mini-stat">
            <span class="label">Filtered Results</span>
            <span class="value highlight-blue" id="stat-filtered-total">0</span>
        </div>
        <div class="mini-stat">
            <span class="label">Complete Metadata</span>
            <span class="value highlight-green" id="stat-complete">0</span>
        </div>
        <div class="mini-stat">
            <span class="label">Incomplete Metadata</span>
            <span class="value highlight-orange" id="stat-incomplete">0</span>
        </div>
        <div class="mini-stat">
            <span class="label">With PDF Links</span>
            <span class="value" id="stat-has-pdf">0</span>
        </div>
    </div>

    <div class="main-grid">
        <aside class="sidebar-filters">
            <div class="filter-group">
                <label><i data-lucide="search" size="14"></i> Keyword Search</label>
                <input type="text" id="keywordSearch" class="search-input" placeholder="Title, DOI, Abstract...">
            </div>

            <div class="filter-group">
                <label>Publication Year</label>
                <select id="yearFilter">
                    <option value="all">Show All Years</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Completion Status</label>
                <select id="completionFilter">
                    <option value="all">All Records</option>
                    <option value="complete">Complete Metadata (Title + Abstract + DOI)</option>
                    <option value="incomplete">Incomplete Metadata</option>
                </select>
            </div>

            <div class="filter-group">
                <label>PDF Availability</label>
                <select id="pdfFilter">
                    <option value="all">All</option>
                    <option value="yes">Available</option>
                    <option value="no">Not Available</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;">
            
            <div class="filter-group">
                <label>Filtered Growth Trend</label>
                <div class="chart-container">
                    <canvas id="miniTrendChart"></canvas>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th style="width: 55%;">Article Details & Links</th>
                        <th>Identifier</th>
                        <th>Publication Date</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </main>
    </div>
</div>

<script>
    let rawData = [];
    let trendChart;

    async function init() {
        lucide.createIcons();
        try {
            const response = await fetch('agrirxiv_final_data.json');
            rawData = await response.json();
            
            setupYearFilter();
            applyFilters();
        } catch (e) {
            console.error("Data Load Error", e);
        }
    }

    function setupYearFilter() {
        const years = [...new Set(rawData.map(d => new Date(d.publish_date).getFullYear()))].sort((a,b) => b-a);
        const select = document.getElementById('yearFilter');
        years.forEach(y => {
            if(!isNaN(y)) select.innerHTML += `<option value="${y}">${y}</option>`;
        });
    }

    function checkCompleteness(item) {
        return !!(item.title && item.abstract && item.abstract.length > 20 && item.doi);
    }

    function applyFilters() {
        const searchTerm = document.getElementById('keywordSearch').value.toLowerCase();
        const selectedYear = document.getElementById('yearFilter').value;
        const completionStatus = document.getElementById('completionFilter').value;
        const pdfStatus = document.getElementById('pdfFilter').value;

        const filtered = rawData.filter(item => {
            const isComplete = checkCompleteness(item);
            const hasPdf = !!(item.pdf_url && item.pdf_url !== "");
            const year = new Date(item.publish_date).getFullYear().toString();

            const matchSearch = item.title.toLowerCase().includes(searchTerm) || (item.doi && item.doi.toLowerCase().includes(searchTerm));
            const matchYear = selectedYear === 'all' || year === selectedYear;
            const matchComplete = completionStatus === 'all' || (completionStatus === 'complete' ? isComplete : !isComplete);
            const matchPdf = pdfStatus === 'all' || (pdfStatus === 'yes' ? hasPdf : !hasPdf);

            return matchSearch && matchYear && matchComplete && matchPdf;
        });

        updateUI(filtered);
    }

    function updateUI(data) {
        const completeCount = data.filter(d => checkCompleteness(d)).length;
        const pdfCount = data.filter(d => d.pdf_url && d.pdf_url !== "").length;

        document.getElementById('stat-filtered-total').innerText = data.length;
        document.getElementById('stat-complete').innerText = completeCount;
        document.getElementById('stat-incomplete').innerText = data.length - completeCount;
        document.getElementById('stat-has-pdf').innerText = pdfCount;

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = data.map(item => {
            const complete = checkCompleteness(item);
            const hasPdf = item.pdf_url && item.pdf_url !== "";
            const hasArticle = item.article_url && item.article_url !== "";

            return `
                <tr>
                    <td>
                        <span class="badge ${complete ? 'bg-complete' : 'bg-complete'}">
                            ${complete ? 'COMPLETE' : 'COMPLETE'}
                        </span>
                    </td>
                    <td>
                        <div style="font-weight:700; color:var(--accent); margin-bottom:4px;">${item.title}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted); display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                            ${item.abstract || 'No abstract content available.'}
                        </div>
                        
                        <div class="action-links">
                            ${`<a href="${item.link}" target="_blank" class="btn-action btn-article"><i data-lucide="external-link" size="14"></i> View Article</a>`
                            }
                            
                            ${hasPdf ? 
                                `<a href="${item.pdf_url}" target="_blank" class="btn-action btn-pdf"><i data-lucide="file-text" size="14"></i> Download PDF</a>` : 
                                `<span class="btn-action btn-disabled">PDF N/A</span>`
                            }
                        </div>
                    </td>
                    <td style="font-family:monospace; font-size:0.7rem;">${item.doi || 'MISSING_DOI'}</td>
                    <td style="font-weight:600;">${item.publish_date}</td>
                </tr>
            `;
        }).join('');

        lucide.createIcons();
        updateChart(data);
    }

    function updateChart(data) {
        const years = {};
        data.forEach(d => {
            const y = new Date(d.publish_date).getFullYear();
            if(!isNaN(y)) years[y] = (years[y] || 0) + 1;
        });

        const ctx = document.getElementById('miniTrendChart').getContext('2d');
        if(trendChart) trendChart.destroy();
        
        trendChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(years),
                datasets: [{
                    label: 'Items',
                    data: Object.values(years),
                    backgroundColor: '#2563eb'
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { display: false }, x: { grid: { display: false } } }
            }
        });
    }

    document.getElementById('keywordSearch').addEventListener('input', applyFilters);
    document.getElementById('yearFilter').addEventListener('change', applyFilters);
    document.getElementById('completionFilter').addEventListener('change', applyFilters);
    document.getElementById('pdfFilter').addEventListener('change', applyFilters);

    init();
</script>
</body>
</html>
